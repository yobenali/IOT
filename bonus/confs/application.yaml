apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wil-playground
  namespace: argocd
spec:
  project: default
  source:
    # The local GitLab, reached through its in-cluster Service (no ingress needed)
    repoURL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/root/aoueldma.git
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
