# Helm values for the official GitLab chart (https://charts.gitlab.io)
# Minimal single-node setup: GitLab CE behind the K3s built-in Traefik,
# plain HTTP on http://gitlab.localhost, optional components turned off.

global:
  edition: ce
  hosts:
    domain: localhost
    https: false
    gitlab:
      name: gitlab.localhost
      https: false
  ingress:
    class: traefik
    configureCertmanager: false
    tls:
      enabled: false
  kas:
    enabled: false
  # External PostgreSQL / Valkey from confs/gitlab-deps.yaml
  # (GitLab 19 / chart 10 no longer bundles them)
  psql:
    host: gitlab-postgres.gitlab.svc.cluster.local
    port: 5432
    database: gitlabhq_production
    username: gitlab
    password:
      useSecret: true
      secret: gitlab-postgres
      key: psql-password
  redis:
    host: gitlab-valkey.gitlab.svc.cluster.local
    port: 6379
    auth:
      enabled: false
  minio:
    enabled: false
  # Object storage on Garage (confs/gitlab-deps.yaml). The connection Secret
  # "gitlab-object-storage" and the buckets are created by scripts/install.sh.
  appConfig:
    object_store:
      enabled: true
      proxy_download: true   # storage is not exposed through the ingress
      connection:
        secret: gitlab-object-storage
        key: config
    lfs:
      bucket: git-lfs
    artifacts:
      bucket: gitlab-artifacts
    uploads:
      bucket: gitlab-uploads
    packages:
      bucket: gitlab-packages
    externalDiffs:
      bucket: gitlab-mr-diffs
    terraformState:
      bucket: gitlab-terraform-state
    ciSecureFiles:
      bucket: gitlab-ci-secure-files
    dependencyProxy:
      bucket: gitlab-dependency-proxy
    backups:
      bucket: gitlab-backups
      tmpBucket: tmp

postgresql:
  install: false
redis:
  install: false

# No TLS, so no cert-manager. The chart still checks that an email is set.
installCertmanager: false
certmanager-issuer:
  email: admin@example.com

# K3s already ships Traefik as ingress controller
nginx-ingress:
  enabled: false

# Not needed for the lab: saves several GB of RAM
prometheus:
  install: false
gitlab-runner:
  install: false
registry:
  enabled: false
upgradeCheck:
  enabled: false

gitlab:
  # Git over SSH is not used: Argo CD and the user both clone over HTTP
  gitlab-shell:
    enabled: false
  gitlab-exporter:
    enabled: false
  toolbox:
    backups:
      objectStorage:
        config:
          secret: gitlab-object-storage-s3cmd
          key: config
  webservice:
    minReplicas: 1
    maxReplicas: 1
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
